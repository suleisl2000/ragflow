  http_port: 9380

admin:
  host: 0.0.0.0
  http_port: 9381

mysql:
  name: 'rag_flow'
  user: 'ragflow'
  password: 'ragflow_password_2024'
  host: 'localhost'
  port: 3306
  max_connections: 900
  stale_timeout: 300
  max_allowed_packet: 1073741824

minio:
  user: 'minioadmin'
  password: 'minioadmin'
  host: '127.0.0.1:9000'

infinity:
  uri: '127.0.0.1:23817'
  db_name: 'default_db'

redis:
  db: 1
  password: 'infini_rag_flow'
  host: 'localhost:6379'

ocr:
  # PaddleOCR 配置（默认使用）
  paddleocr:
    api_url: 'http://localhost:8080/layout-parsing'
  # Textin OCR 配置（备选）
  textin:
    app_id: ''
    secret_code: ''
    api_url: 'https://api.textin.com/ai/service/v1/pdf_to_markdown'

# 混合配置：LLM 使用 Tongyi-Qianwen，Embedding 使用 LocalAI
user_default_llm:
  factory: 'Tongyi-Qianwen'  # 默认工厂（如果模型未指定则使用此）
  api_key: 'sk-xxx'
  base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
  default_models:
    chat_model:
      name: 'qwen3-8b'
      factory: 'Tongyi-Qianwen'
      api_key: 'sk-xxx'
      base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
    embedding_model:
      name: 'Qwen3-Embedding-8B'
      factory: 'LocalAI'
      api_key: 'empty'
      base_url: 'http://localhost:8082'

